# The repo's own CI: build, unit tests, lint on every PR and on main.
#
# Also the source of truth for `kb code-ingest`'s cmd.build / cmd.test /
# cmd.lint: it takes the first CI-sourced command per purpose, walking
# .github/workflows/ in filename order, so this file (ci.yml) must sort
# before kb-*.yml — otherwise strata's own `kb build` / `kb pr lint` steps
# get recorded as this repo's build and lint commands.
#
# GitHub-hosted runner; node 22 via setup-node, pnpm from package.json
# `packageManager` (10.0.0) via corepack.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: npx eslint . && npx prettier --check .
