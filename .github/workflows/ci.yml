# The repo's own CI: build, unit tests, lint on every PR and on main.
#
# Also the source of truth for `kb code-ingest`'s cmd.build / cmd.test /
# cmd.lint: it takes the first CI-sourced command per purpose, walking
# .github/workflows/ in filename order, so this file (ci.yml) must sort
# before kb-*.yml — otherwise strata's own `kb build` / `kb pr lint` steps
# get recorded as this repo's build and lint commands.
#
# Runs on the self-hosted runner (GitHub-hosted minutes are blocked on this
# private repo's account billing). The host provides node 22 and pnpm 10.0.0
# (package.json `packageManager`).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: [self-hosted, strata-intake]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: npx eslint . && npx prettier --check .
