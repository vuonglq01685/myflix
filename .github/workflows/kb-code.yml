name: kb-code

# PR gate only. Publishing is `kb publish --pr` on a dev machine (opens a PR
# on the GitHub hub; see the kb-publish skill).
#
# LOCAL DEVIATION from the strata-kb 1.6.0 template (re-apply after every
# `kb init --kind dev`, which overwrites this file): the template also runs a
# `publish` job (`kb ci-publish`, OIDC → intake) on push to main/master. That
# job cannot succeed here — the intake (`intake:` in .kb/config.yaml) is
# http://localhost:8321, unreachable from GitHub-hosted runners — so it is
# removed together with its push trigger and concurrency group.

on:
  pull_request:
  workflow_dispatch:

jobs:
  # Validate only, never publishes. `kb build` regenerates -code from the
  # merge ref first (it is never committed), so this validates what the
  # merge would publish — and catches a malformed -svc edit or a `pending`
  # section committed before review, before merge, not after.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install strata-kb==1.6.0
      - run: kb build
