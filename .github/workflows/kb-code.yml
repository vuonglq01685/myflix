name: kb-code

# PR gate only. Publishing lives in kb-publish.yml.
#
# LOCAL DEVIATION from the strata-kb 1.2.0 template (re-apply after every
# `kb init --kind dev`, which overwrites this file): the template also runs a
# `publish` job on push to main/master. That job can never succeed —
# intake.authorize() (strata-kb 1.2.0 and 1.3.0) accepts only OIDC tokens whose
# `ref` starts with `refs/tags/kb-publish/`, so a branch-push token is refused
# with HTTP 403. The publish path that works is the tag-triggered
# kb-publish.yml, started by `kb publish` on a dev machine.

on:
  pull_request:
  workflow_dispatch:

jobs:
  # Validate only, never publishes. Catches a malformed -svc edit or a
  # `pending` section committed before review — before merge, not after.
  validate:
    # LOCAL DEVIATION (re-apply after `kb init`): self-hosted runner, not
    # ubuntu-latest. GitHub-hosted minutes are blocked on this private repo's
    # account billing; the self-hosted runner uses none.
    runs-on: [self-hosted, strata-intake]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install strata-kb==1.2.0
      - run: kb build
