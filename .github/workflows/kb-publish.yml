# Publishes this repo's .kb/ (myflix-code + myflix-svc) to the main hub
# through the intake service: OIDC, zero secrets in this repo.
#
# Trigger: `kb publish` on a dev machine, run on an up-to-date `main`, tags
# the commit `kb-publish/<ts>` and pushes the tag. The intake only accepts
# tokens minted for a `refs/tags/kb-publish/*` ref.
#
# Based on the strata-kb 1.2.0 kb-publish.yml template, with two local changes
# (re-apply after `kb init`):
#   1. runs-on the self-hosted runner on the hub host, because the intake
#      (`intake:` in .kb/config.yaml) is http://localhost:8321 and is not
#      reachable from GitHub-hosted runners;
#   2. regenerates myflix-code with `kb code-ingest` + `kb build` first, which
#      is what the template's kb-code.yml publish job was meant to do.
name: kb-publish

on:
  push:
    tags: ["kb-publish/*"]

# One publish at a time; never cancel one mid-flight (it would leave the hub's
# publish/myflix branch half-written).
concurrency:
  group: kb-publish
  cancel-in-progress: false

permissions:
  id-token: write # OIDC JWT — proves "I am vuonglq01685/myflix" to the intake
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, strata-intake]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: python -m pip install strata-kb==1.2.0
      # CI must never create `pending` -svc content, so --scaffold-svc is
      # never passed here (it would fail the kb build step below).
      - run: kb code-ingest
      - run: kb build
      - name: Publish snapshot → PR on the hub (via intake)
        run: kb ci-publish
