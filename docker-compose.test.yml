# Publishes the datastores to the host so `pnpm test:e2e` (Jest + Supertest)
# can talk to real Postgres / Redis / MinIO from outside the network.
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
services:
  postgres:
    ports: ["5432:5432"]
  redis:
    ports: ["6379:6379"]
  minio:
    ports: ["9000:9000", "9001:9001"]
